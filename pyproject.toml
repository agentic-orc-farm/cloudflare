[project]
name = "cf-plane"
version = "0.1.0"
description = "The Cloudflare plane for agentic-orc-farm: a stateless shim that turns a project's deploy.yaml components into wrangler deploys and Access applications."
requires-python = ">=3.13"
# pydantic: frozen models at the boundary (PYTHON-BASE.md section 5).
# httpx: one client for the Cloudflare and GitHub APIs, per-request timeouts, no Authorization header across
# a cross-origin redirect, and MockTransport for credential-free tests (the design's stack table).
dependencies = ["pydantic>=2.10", "httpx>=0.28"]

[project.scripts]
cf-plane = "cf_plane.cli:main"

[dependency-groups]
# pyyaml reads the workflows in tests; zizmor lints them (the design's stack table).
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "pyright>=1.1",
    "pip-audit>=2.7",
    "import-linter>=2.0",
    "pyyaml>=6.0",
    "zizmor>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_plane"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D1", "PTH", "BLE", "S", "T20", "C90", "PLR0911", "PLR0912", "PLR0915"]
# S603 and S607 stay ignored: running wrangler is the shim's job.
ignore = ["D100", "D105", "D107", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# A command prints its result; cli.py is the module of commands.
"src/cf_plane/cli.py" = ["T20"]
"tests/**" = ["ANN", "D1", "S", "T20", "PLR", "PTH", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.13"

[tool.importlinter]
root_package = "cf_plane"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The shim is layered: each part may import only the ones below it"
type = "layers"
layers = [
    "cf_plane.cli",
    "cf_plane.cloudflare | cf_plane.artefacts | cf_plane.wrangler",
    "cf_plane.changes",
    "cf_plane.static_site | cf_plane.access",
    "cf_plane.contract",
]

[[tool.importlinter.contracts]]
name = "The pure modules touch neither the network nor other programs"
type = "forbidden"
source_modules = ["cf_plane.contract", "cf_plane.static_site", "cf_plane.access", "cf_plane.changes"]
forbidden_modules = ["httpx", "subprocess"]
